# 镜像标签规则：
#   main 分支         -> :latest（稳定版，NAS 默认部署）
#   测试分支           -> :test（测试版，NAS 可切过去试用）
#   任意分支提交       -> :sha-<commit>（精确回滚点）
name: Build & Push Docker Image

on:
  push:
    branches: [main, codex/pixoo-features]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || format('{0}:test', env.IMAGE) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
