services:
  pixoo-status:
    # CI 自动构建推送的镜像；NAS 每次启动会拉取最新版
    image: ghcr.io/miharia/pixoo64-status:latest
    # 想在 NAS 上本地构建（不依赖 GitHub）时，注释掉上面 image 行，
    # 取消下面两行注释：
    # build: .
    # image: pixoo-status:local
    container_name: pixoo-status
    restart: unless-stopped
    ports:
      # 宿主端口 10004，容器内部固定 8000
      - "10004:8000"
    environment:
      # 设备 IP 在网页上配置，不在此处写死
      STATUS_PORT: "8000"
      # 图案轮播间隔（秒）
      STATUS_ROTATE: "15"
      TZ: "Asia/Shanghai"
      # 网页“检查更新”按钮转发到 Watchtower
      UPDATE_URL: "http://watchtower:8080/v1/update"
      UPDATE_TOKEN: "${UPDATE_TOKEN:-pixoo-status-update}"
    volumes:
      # 状态和预览图持久化到宿主机 ./data 目录
      - ./data:/app/data
    labels:
      # 只让 Watchtower 自动更新本服务
      - "com.centurylinklabs.watchtower.enable=true"

  # 自动更新器：默认每 12 小时检查 ghcr.io 上的新镜像；
  # 网页上也有“检查更新”按钮可手动触发
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "43200"
      WATCHTOWER_LABEL_ENABLE: "true"
      # 启用 HTTP API，供网页“检查更新”按钮调用
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${UPDATE_TOKEN:-pixoo-status-update}"
      WATCHTOWER_HTTP_API_PORT: "8080"
      # 修复：新 Docker（≥29）最低要求 API 1.40，watchtower 默认卡在 1.25
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
